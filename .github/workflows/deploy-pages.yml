# Publishes the One Lantern game (public/one-lantern) as the GitHub Pages
# site root: https://andrewkillinger.github.io/Power10/
name: Deploy One Lantern to GitHub Pages

on:
  push:
    branches:
      - claude/journalist-dashboard-kanban-kSWwN # default branch
      - claude/one-lantern-roguelike-5mu78g
    paths:
      - 'public/one-lantern/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Create/enable the Pages site (source: GitHub Actions) if it
          # hasn't been enabled in repo settings yet.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/one-lantern
      - id: deployment
        uses: actions/deploy-pages@v4
